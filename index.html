<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AR Tracing Workspace</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&display=swap');

        /* Chặn mọi hành vi cuộn/kéo trang của Safari */
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Archivo Narrow', system-ui, sans-serif;
            touch-action: none; 
            overscroll-behavior: none;
        }

        /* Lớp 1: Camera Feed */
        #camera-feed {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Lớp 2: Khung giấy & Lưới thước đo */
        #paper-grid {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #00B4FF;
            background-image: 
                linear-gradient(rgba(0, 180, 255, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 180, 255, 0.3) 1px, transparent 1px);
            background-size: 10% 10%;
            z-index: 2;
            pointer-events: none;
            display: none;
            transition: all 0.3s ease;
        }

        /* Hiệu ứng khi KHÓA TRỤC */
        #paper-grid.locked {
            border: 3px solid #00FF00;
            background-image: none; /* Ẩn lưới thừa bên trong */
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }

        /* Lớp 3: Ảnh Mẫu */
        #tracing-image {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            z-index: 3;
            opacity: 0.5;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform;
        }

        /* Lớp 4: Tấm nền bắt chạm cảm ứng */
        #touch-area {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 4;
            pointer-events: none; /* Bật/tắt bằng JS */
        }

        /* UI: Bảng Điều Khiển chung */
        .panel {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #00B4FF;
            border-radius: 12px;
            padding: 16px 20px;
            width: 85%;
            max-width: 400px;
            display: flex; flex-direction: column; gap: 16px;
        }

        .hidden { display: none !important; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .row-buttons { display: flex; gap: 8px; justify-content: space-between; }

        label {
            color: #E2E8F0; font-size: 14px; font-weight: 600;
            display: flex; justify-content: space-between;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        select {
            background: rgba(0, 0, 0, 0.5); color: #00B4FF;
            border: 1px solid #00B4FF; padding: 8px;
            border-radius: 8px; font-family: 'Archivo Narrow', sans-serif;
            font-size: 14px; outline: none;
            text-align: center;
        }

        button {
            font-family: 'Archivo Narrow', sans-serif;
            background: transparent; color: #00B4FF;
            border: 1px solid #00B4FF; padding: 10px 12px;
            border-radius: 8px; font-weight: bold;
            font-size: 13px; cursor: pointer; flex: 1;
            text-transform: uppercase; transition: 0.2s;
        }

        button:active { background: rgba(0, 180, 255, 0.2); }
        .btn-primary { color: #00FF00; border-color: #00FF00; }
        .btn-primary:active { background: rgba(0, 255, 0, 0.2); }

        input[type="file"] { color: #94A3B8; font-size: 14px; width: 100%; }
        input[type="file"]::file-selector-button {
            background-color: transparent; color: #00B4FF;
            border: 1px solid #00B4FF; padding: 8px 16px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
            margin-right: 12px; font-family: 'Archivo Narrow', sans-serif;
        }

        input[type="range"] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px;
            border-radius: 50%; background: #00FF00; cursor: pointer;
            margin-top: -8px; box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; background: rgba(0, 180, 255, 0.3); border-radius: 2px;
        }

        /* UI: Nút Unlock (Góc phải dưới) */
        #btn-unlock-corner {
            position: absolute;
            bottom: 20px; right: 20px;
            z-index: 20;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 255, 0, 0.5);
            color: rgba(0, 255, 0, 0.8);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        #btn-unlock-corner:active { opacity: 1; }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline muted></video>
    <div id="paper-grid"></div>
    <img id="tracing-image" src="" alt="">
    <div id="touch-area"></div>

    <!-- 1. TRẠNG THÁI KHỞI TẠO -->
    <div id="panel-init" class="panel">
        <div class="control-group">
            <label>CHỌN ẢNH MẪU</label>
            <input type="file" id="image-upload" accept="image/*">
        </div>
        <div class="control-group">
            <label><span>ĐỘ TRONG SUỐT</span><span id="opacity-val">50%</span></label>
            <input type="range" id="opacity-slider" min="0.1" max="1.0" step="0.05" value="0.5">
        </div>
        <button id="btn-enter-align" style="margin-top: 5px;">👁️ MỞ CĂN CHỈNH</button>
    </div>

    <!-- 2. TRẠNG THÁI CĂN CHỈNH -->
    <div id="panel-align" class="panel hidden">
        <div class="control-group" style="margin-bottom: 5px;">
            <label>CHỌN KHỔ GIẤY THỰC TẾ</label>
            <!-- Sử dụng data-attribute để điều khiển kích thước lưới -->
            <select id="paper-size-select">
                <optgroup label="Khổ Ngang (Landscape)">
                    <option value="A3-L" data-ratio="1.414/1" data-width="98" data-maxh="85">A3 Khổ Ngang</option>
                    <option value="A4-L" data-ratio="1.414/1" data-width="90" data-maxh="70">A4 Khổ Ngang</option>
                    <option value="A5-L" data-ratio="1.414/1" data-width="75" data-maxh="60">A5 Khổ Ngang</option>
                </optgroup>
                <optgroup label="Khổ Dọc (Portrait)">
                    <option value="A3-P" data-ratio="1/1.414" data-width="95" data-maxh="85">A3 Khổ Dọc</option>
                    <option value="A4-P" data-ratio="1/1.414" data-width="80" data-maxh="80" selected>A4 Khổ Dọc</option>
                    <option value="A5-P" data-ratio="1/1.414" data-width="65" data-maxh="70">A5 Khổ Dọc</option>
                </optgroup>
            </select>
        </div>
        <div class="row-buttons">
            <button id="btn-rotate">Xoay 90°</button>
            <button id="btn-flip-h">Lật Ngang</button>
            <button id="btn-flip-v">Lật Dọc</button>
        </div>
        <div class="row-buttons" style="margin-top: 10px;">
            <button id="btn-back-init">⬅ HỦY</button>
            <button id="btn-lock" class="btn-primary">🔒 KHÓA TRỤC</button>
        </div>
    </div>

    <!-- 3. TRẠNG THÁI KHÓA -->
    <button id="btn-unlock-corner" class="hidden">🔓 MỞ KHÓA</button>

    <script>
        // Các DOM Elements chính
        const video = document.getElementById('camera-feed');
        const img = document.getElementById('tracing-image');
        const touchArea = document.getElementById('touch-area');
        const paperGrid = document.getElementById('paper-grid');
        
        const panelInit = document.getElementById('panel-init');
        const panelAlign = document.getElementById('panel-align');
        const btnUnlockCorner = document.getElementById('btn-unlock-corner');
        
        // Quản lý Trạng Thái & Biến đổi ảnh
        let appState = 'INIT'; // INIT, ALIGN, LOCKED
        let tx = 0, ty = 0, scale = 1, rotation = 0, flipX = 1, flipY = 1;

        // Khởi động Camera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Vui lòng cấp quyền Camera và mở thông qua HTTPS.");
            }
        }
        startCamera();

        // Nạp ảnh mẫu
        document.getElementById('image-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (img.src) URL.revokeObjectURL(img.src);
                img.src = URL.createObjectURL(file);
                // Reset toạ độ khi tải ảnh mới
                tx = 0; ty = 0; scale = 1; rotation = 0; flipX = 1; flipY = 1;
                applyTransform();
            }
        });

        // Thanh trượt độ trong suốt
        document.getElementById('opacity-slider').addEventListener('input', (e) => {
            img.style.opacity = e.target.value;
            document.getElementById('opacity-val').textContent = Math.round(e.target.value * 100) + '%';
        });

        // ==========================================
        // UI / UX STATE MANAGER
        // ==========================================
        function switchState(newState) {
            appState = newState;
            
            // Ẩn tất cả UI trước
            panelInit.classList.add('hidden');
            panelAlign.classList.add('hidden');
            btnUnlockCorner.classList.add('hidden');
            paperGrid.classList.remove('locked');
            
            if (newState === 'INIT') {
                panelInit.classList.remove('hidden');
                paperGrid.style.display = 'none';
                touchArea.style.pointerEvents = 'none'; // Tắt cảm ứng ảnh
            } 
            else if (newState === 'ALIGN') {
                panelAlign.classList.remove('hidden');
                paperGrid.style.display = 'block';
                touchArea.style.pointerEvents = 'auto'; // Bật cảm ứng vùng ảnh
            } 
            else if (newState === 'LOCKED') {
                btnUnlockCorner.classList.remove('hidden');
                paperGrid.style.display = 'block';
                paperGrid.classList.add('locked');      // Kích hoạt viền xanh, ẩn lưới
                touchArea.style.pointerEvents = 'none'; // Khoá cảm ứng hoàn toàn
            }
        }

        // Gắn sự kiện nút chuyển trạng thái
        document.getElementById('btn-enter-align').addEventListener('click', () => switchState('ALIGN'));
        document.getElementById('btn-back-init').addEventListener('click', () => switchState('INIT'));
        document.getElementById('btn-lock').addEventListener('click', () => switchState('LOCKED'));
        btnUnlockCorner.addEventListener('click', () => switchState('ALIGN'));

        // ==========================================
        // CÔNG CỤ CĂN CHỈNH (GRID & TRANSFORM)
        // ==========================================
        function applyTransform() {
            img.style.transform = `translate(${tx}px, ${ty}px) rotate(${rotation}deg) scaleX(${scale * flipX}) scaleY(${scale * flipY})`;
        }

        // Thay đổi lưới tuỳ theo khổ giấy
        document.getElementById('paper-size-select').addEventListener('change', (e) => {
            const selectedOption = e.target.options[e.target.selectedIndex];
            const ratio = selectedOption.getAttribute('data-ratio');
            const width = selectedOption.getAttribute('data-width');
            const maxH = selectedOption.getAttribute('data-maxh');

            paperGrid.style.aspectRatio = ratio;
            paperGrid.style.width = width + '%';
            paperGrid.style.maxHeight = maxH + 'vh';
        });

        // Trigger mặc định lúc mới load
        document.getElementById('paper-size-select').dispatchEvent(new Event('change'));

        // Xoay & Lật
        document.getElementById('btn-rotate').addEventListener('click', () => { rotation = (rotation + 90) % 360; applyTransform(); });
        document.getElementById('btn-flip-h').addEventListener('click', () => { flipX *= -1; applyTransform(); });
        document.getElementById('btn-flip-v').addEventListener('click', () => { flipY *= -1; applyTransform(); });

        // ==========================================
        // TƯƠNG TÁC ĐA ĐIỂM (MOBILE SAFARI FIX)
        // ==========================================
        // Chặn zoom hệ thống (bảo hiểm cho iOS 15+)
        document.addEventListener('touchmove', (e) => {
            if(e.scale !== 1) e.preventDefault(); 
        }, { passive: false });

        let activeTouches = 0;
        let startX = 0, startY = 0, baseTx = 0, baseTy = 0;
        let startDist = 0, baseScale = 1;

        // Tính khoảng cách giữa 2 ngón tay
        function getDistance(t1, t2) {
            return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        }

        // Tìm tâm điểm giữa 2 ngón tay
        function getCenter(t1, t2) {
            return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
        }

        touchArea.addEventListener('touchstart', (e) => {
            if (appState !== 'ALIGN') return;
            e.preventDefault(); 
            activeTouches = e.touches.length;
            
            if (activeTouches === 1) {
                startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                baseTx = tx; baseTy = ty;
            } else if (activeTouches === 2) {
                startDist = getDistance(e.touches[0], e.touches[1]);
                baseScale = scale;
                const center = getCenter(e.touches[0], e.touches[1]);
                startX = center.x; startY = center.y;
                baseTx = tx; baseTy = ty;
            }
        }, { passive: false });

        touchArea.addEventListener('touchmove', (e) => {
            if (appState !== 'ALIGN') return;
            e.preventDefault(); // Chặn cuộn trang/rubber-banding
            
            if (activeTouches === 1 && e.touches.length === 1) {
                // Kéo (Pan)
                tx = baseTx + (e.touches[0].clientX - startX);
                ty = baseTy + (e.touches[0].clientY - startY);
            } 
            else if (activeTouches === 2 && e.touches.length === 2) {
                // Thu phóng (Pinch to zoom)
                const currentDist = getDistance(e.touches[0], e.touches[1]);
                scale = baseScale * (currentDist / startDist);
                
                const center = getCenter(e.touches[0], e.touches[1]);
                tx = baseTx + (center.x - startX);
                ty = baseTy + (center.y - startY);
            }
            applyTransform();
        }, { passive: false });

        touchArea.addEventListener('touchend', (e) => {
            if (appState !== 'ALIGN') return;
            e.preventDefault();
            activeTouches = e.touches.length;
            
            // Xử lý bù toạ độ khi người dùng thả 1 ngón tay ra trước
            if (activeTouches === 1) {
                startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                baseTx = tx; baseTy = ty;
            }
        }, { passive: false });

    </script>
</body>
</html>
