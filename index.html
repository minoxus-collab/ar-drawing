<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Tracing</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Archivo Narrow', system-ui, sans-serif;
        }

        /* Lớp Camera */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Lớp Ảnh */
        #tracing-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 2;
            opacity: 0.5;
            pointer-events: none; 
        }

        /* Nút ẩn/hiện UI góc trên bên phải */
        #toggle-ui-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid #00B4FF;
            color: #00B4FF;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 180, 255, 0.2);
            transition: all 0.3s ease;
        }

        /* Bảng điều khiển */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid #00B4FF;
            border-radius: 16px;
            padding: 16px 20px;
            width: 85%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            /* Hiệu ứng trượt mượt mà khi ẩn/hiện */
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
        }

        /* Class thêm vào khi bấm ẩn UI */
        #controls.hidden {
            transform: translate(-50%, 150%);
            opacity: 0;
            pointer-events: none;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: #E2E8F0;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        input[type="file"] {
            color: #94A3B8;
            font-size: 14px;
        }

        input[type="file"]::file-selector-button {
            background-color: #00B4FF;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 12px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #00FF00;
            cursor: pointer;
            margin-top: -9px;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline muted></video>
    <img id="tracing-image" src="" alt="">

    <!-- Nút Tắt/Bật giao diện -->
    <div id="toggle-ui-btn">
        <!-- Icon Mở mắt mặc định -->
        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
    </div>

    <!-- Cụm điều khiển -->
    <div id="controls">
        <div class="control-group">
            <label>CHỌN ẢNH MẪU</label>
            <input type="file" id="image-upload" accept="image/*">
        </div>
        
        <div class="control-group">
            <label>
                <span>ĐỘ TRONG SUỐT</span>
                <span id="opacity-val">50%</span>
            </label>
            <input type="range" id="opacity-slider" min="0.1" max="1.0" step="0.05" value="0.5">
        </div>
    </div>

    <script>
        const video = document.getElementById('camera-feed');
        const img = document.getElementById('tracing-image');
        const uploadBtn = document.getElementById('image-upload');
        const slider = document.getElementById('opacity-slider');
        const opVal = document.getElementById('opacity-val');
        const toggleBtn = document.getElementById('toggle-ui-btn');
        const controls = document.getElementById('controls');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Vui lòng đảm bảo bạn đang mở link từ Vercel (HTTPS) và đã cho phép Safari dùng Camera.");
            }
        }
        
        startCamera();

        uploadBtn.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (img.src) URL.revokeObjectURL(img.src);
                img.src = URL.createObjectURL(file);
            }
        });

        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            img.style.opacity = val;
            opVal.textContent = Math.round(val * 100) + '%';
        });

        // Xử lý sự kiện ẩn/hiện UI
        let isUiHidden = false;
        toggleBtn.addEventListener('click', () => {
            isUiHidden = !isUiHidden;
            if (isUiHidden) {
                controls.classList.add('hidden');
                toggleBtn.style.borderColor = '#00FF00';
                toggleBtn.style.color = '#00FF00';
                toggleBtn.style.boxShadow = '0 4px 12px rgba(0, 255, 0, 0.2)';
                // Đổi sang icon Nhắm mắt
                toggleBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>`;
            } else {
                controls.classList.remove('hidden');
                toggleBtn.style.borderColor = '#00B4FF';
                toggleBtn.style.color = '#00B4FF';
                toggleBtn.style.boxShadow = '0 4px 12px rgba(0, 180, 255, 0.2)';
                // Đổi lại icon Mở mắt
                toggleBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>`;
            }
        });
    </script>
</body>
</html>
